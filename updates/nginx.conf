# Sender update feed: https://trovarci.sh/updates/. Installers, block maps and latest.yml, served
# from a volume with byte ranges, so an installed copy downloads only what changed.

server {
    listen 80;
    server_name _;

    root /srv;
    server_tokens off;
    autoindex off;
    etag on;
    max_ranges 1024;
    sendfile on;
    tcp_nopush on;

    types {
        application/octet-stream exe blockmap;
        text/yaml yml;
    }
    default_type application/octet-stream;

    # Whether or not the proxy strips /updates, both paths reach the same files.
    location = /latest.yml { rewrite ^ /updates/latest.yml last; }
    location ~ ^/(?<file>[^/]+\.(?:exe|blockmap))$ { rewrite ^ /updates/$file last; }

    location = /updates/latest.yml {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/updates/[A-Za-z0-9][A-Za-z0-9._-]*\.(?:exe|blockmap)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /healthz { access_log off; return 200 "ok\n"; }

    location / { return 404; }
}
